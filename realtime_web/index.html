<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="本地语音对话：说话自动识别、自动回复与播放。">
  <title>声线对话 · 实时语音</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/realtime/style.css">
  <script src="/audio.js" defer></script>
  <script src="/vad.js" defer></script>
  <script src="/realtime/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">VOICE<sup>˚</sup></span><div><h1>声线对话</h1><p id="voice-name">正在载入</p></div></div>
      <a class="quiet" href="/">返回首页</a>
    </header>

    <section class="setup" id="setup">
      <p class="eyebrow">实时语音</p>
      <h2>说话，就从这里开始。</h2>
      <p class="intro">选择人物或声音。说完后会自动回复，想插话时直接开口。</p>
      <label for="voice-select">人物或声音</label>
      <select id="voice-select"><option value="">正在读取…</option></select>
      <p class="hint" id="setup-hint">点击开始后允许使用麦克风。建议佩戴耳机，减少声音回传。</p>
      <button id="start" class="primary" type="button" disabled>开始实时对话</button>
      <p class="privacy">录音和语音合成留在本机，识别后的文字会发送至配置的聊天服务。</p>
    </section>

    <section class="stage" id="stage" hidden>
      <div class="status" id="status" role="status" aria-live="polite">准备中</div>
      <div class="conversation" id="conversation" aria-live="polite"></div>
      <div class="controls">
        <button id="mic-toggle" class="mic" type="button" disabled>暂停监听</button>
        <button id="stop-play" class="quiet" type="button" hidden>停止播放</button>
        <button id="end" class="danger" type="button">结束对话</button>
      </div>
      <div class="manual">
        <label for="manual-input">也可以输入文字</label>
        <div class="manual-row"><input id="manual-input" maxlength="500" placeholder="输入文字后发送"><button id="manual-send" class="small" type="button">发送</button></div>
      </div>
    </section>
  </div>
  <noscript>实时语音页需要启用 JavaScript；也可使用首页的按住说话。</noscript>
</body>
</html>
