<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="本地语音对话：说话自动识别、自动回复与播放。">
  <title>声线对话 · 实时语音</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/realtime/style.css">
  <script src="/audio.js" defer></script>
  <script src="/vad.js" defer></script>
  <script src="/realtime/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="avatar" aria-hidden="true">声</span><div><h1>声线对话</h1><p id="voice-name">本地语音 · 正在载入</p></div></div>
      <a class="quiet" href="/">返回聊天</a>
    </header>

    <section class="setup" id="setup">
      <label for="voice-select">选择声音（已发布声音与普通参考声音）</label>
      <select id="voice-select"><option value="">正在读取声音…</option></select>
      <p class="hint" id="setup-hint">选择声音后点击开始。切换声音会新建会话；刷新后需重新开始。</p>
      <button id="start" class="primary" type="button" disabled>开始对话</button>
    </section>

    <section class="stage" id="stage" hidden>
      <div class="status" id="status" role="status" aria-live="polite">准备中</div>
      <div class="conversation" id="conversation" aria-live="polite"></div>
      <div class="controls">
        <button id="mic-toggle" class="mic" type="button" disabled>开始监听</button>
        <button id="stop-play" class="quiet" type="button" hidden>停止播放</button>
        <button id="end" class="danger" type="button">结束对话</button>
      </div>
      <div class="manual">
        <label for="manual-input">识别失败时可直接输入</label>
        <div class="manual-row"><input id="manual-input" maxlength="500" placeholder="输入文字后发送"><button id="manual-send" class="small" type="button">发送</button></div>
      </div>
    </section>
  </div>
  <noscript>实时语音页需要启用 JavaScript；也可使用首页的按住说话。</noscript>
</body>
</html>
