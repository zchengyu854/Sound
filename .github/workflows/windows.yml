name: Windows

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-web.txt mlx-cpu==0.32.2
      - run: python -m unittest -v tests.test_platform_support tests.test_main_page tests.test_voice_adapters tests.test_audio_runtime tests.test_voice_app.VoiceAppTests tests.test_voice_app.LLMSettingsTests.test_environment_fallback_until_first_save tests.test_voice_app.LLMSettingsTests.test_blank_preserves_replace_and_explicit_clear
