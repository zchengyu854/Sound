name: Windows

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-web.txt mlx-cpu==0.32.2
      - run: python -m unittest -v test_platform_support test_main_page test_voice_adapters test_audio_runtime test_voice_app.VoiceAppTests test_voice_app.LLMSettingsTests.test_environment_fallback_until_first_save test_voice_app.LLMSettingsTests.test_blank_preserves_replace_and_explicit_clear
